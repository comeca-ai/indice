name: pipeline-stub

on:
  workflow_dispatch:
    inputs:
      note:
        description: Documenta o fluxo parquet para R2 (ainda nao executa ingestao)
        required: false
        default: dry-run

jobs:
  document:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Documentar pipeline
        run: |
          echo "Indicie — pipeline stub (workflow_dispatch)"
          echo "Docs: docs/cnpj-ingest.md | docs/r2-search-contract.md | docs/d1-search-schema.md"
          echo "Sample script: pipelines/cnpj/sample_cnaes_to_parquet.py"
          echo "1. Baixar dados publicos da Receita Federal (WebDAV share YggdBLfdninEJX9 / dados.gov)"
          echo "2. Converter CSV Latin-1 para Parquet ZSTD (prefixos em r2-search-contract)"
          echo "3. Upload para o bucket R2 indicie-cnpj (binding CNPJ_DATA)"
          echo "4. Atualizar manifests/latest.json e validar GET /api/health"
          echo "GHCR ghcr.io/caiopizzol/cnpj-data-pipeline: NEED_LICENSE_REVIEW — runner externo, sem vendor"
